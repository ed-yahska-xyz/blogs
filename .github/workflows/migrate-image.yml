name: Migration image

# Builds and publishes the diary DB migration runner as a container image.
# The kamaji compose stack runs it as a one-shot `migrate` service that gates
# the app, so schema changes ship from this repo without any manual step.
#
# This repo's Actions policy is `local_only` (only actions owned by
# ed-yahska-xyz are permitted), so this workflow deliberately uses no external
# actions — checkout, registry login, and build/push are plain shell. Don't
# reintroduce actions/checkout, docker/login-action, or docker/build-push-action
# here; they trip a startup_failure under that policy.

on:
  push:
    branches: [main]
    paths:
      - "db/**"
      - ".github/workflows/migrate-image.yml"
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  build:
    name: Build & push migration image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/blogs-migrate
    steps:
      - name: Checkout (git, no external action)
        run: |
          git clone --depth 1 --branch "${GITHUB_REF_NAME}" \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" .
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to ghcr.io
        run: echo "${GITHUB_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push migration image
        run: |
          docker build -f db/Dockerfile -t "${IMAGE}:latest" -t "${IMAGE}:${GITHUB_SHA}" db
          docker push "${IMAGE}:latest"
          docker push "${IMAGE}:${GITHUB_SHA}"
